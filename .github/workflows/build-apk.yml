name: Build APK

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/BUILD-LOG.md'
      - 'website/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Run JVM unit tests
        shell: bash
        run: |
          set -o pipefail
          gradle :core-common:test :core-crypto:test :mesh-engine:test --console=plain 2>&1 | tee build-output.txt

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleDebug --console=plain 2>&1 | tee -a build-output.txt
          cp app/build/outputs/apk/debug/app-debug.apk P2PChat-v1.0.0.apk
          ls -la P2PChat-v1.0.0.apk

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: P2P Chat v1.0.0
          body: |
            P2P Chat — offline Bluetooth mesh messaging (BLE multi-hop relay, E2E encrypted).

            Install: download P2PChat-v1.0.0.apk, open it on your Android phone (8.0+),
            allow install from your browser/files app when prompted, then grant the
            Bluetooth permissions inside the app.

            This is a debug-signed build for testing. See the README for the
            physical-device test plan.
          files: P2PChat-v1.0.0.apk

      - name: Save build log on failure
        if: failure()
        shell: bash
        run: |
          mkdir -p docs
          { echo "# Last failed CI build log"; echo; echo "Run: ${{ github.run_id }} — $(date -u)"; echo; echo '```'; tail -n 400 build-output.txt 2>/dev/null; echo '```'; } > docs/BUILD-LOG.md
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/BUILD-LOG.md
          git commit -m "ci: failed build log [skip ci]" || true
          git push || true
